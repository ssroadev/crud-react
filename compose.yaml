
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3002
      FRONTEND_URL: http://localhost:8080
    expose:
      - "3002"
    restart: unless-stopped
    networks:
      - pawhub-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pawhub-network

networks:
  pawhub-network:
    driver: bridge
